AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  CloudStore - Serverless Self-Storage Backend

Globals:
  Function:
    Timeout: 30
    MemorySize: 512
    Runtime: java21

Resources:
  HelloHandlerFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .
      Handler: com.cloudstore.handlers.HelloHandler::handleRequest
      Events:
        HelloApi:
          Type: Api
          Properties:
            Path: /hello
            Method: get
            RestApiId: !Ref CloudStoreApi

  GetUnitsHandlerFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .
      Handler: com.cloudstore.handlers.GetUnitsHandler::handleRequest
      Environment:
        Variables:
          TABLE_NAME: !Ref StorageUnitsTable
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref StorageUnitsTable
      Events:
        GetUnitsApi:
          Type: Api
          Properties:
            Path: /units
            Method: get
            RestApiId: !Ref CloudStoreApi
            Auth:
              Authorizer: CognitoAuthorizer

  CreateBookingHandlerFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .
      Handler: com.cloudstore.handlers.CreateBookingHandler::handleRequest
      Environment:
        Variables:
          BOOKINGS_TABLE_NAME: !Ref BookingsTable
          TABLE_NAME: !Ref StorageUnitsTable
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref BookingsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref StorageUnitsTable
      Events:
        CreateBookingApi:
          Type: Api
          Properties:
            Path: /bookings
            Method: post
            RestApiId: !Ref CloudStoreApi
            Auth:
              Authorizer: CognitoAuthorizer

  GetBookingsHandlerFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .
      Handler: com.cloudstore.handlers.GetBookingsHandler::handleRequest
      Environment:
        Variables:
          BOOKINGS_TABLE_NAME: !Ref BookingsTable
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref BookingsTable
      Events:
        GetBookingsApi:
          Type: Api
          Properties:
            Path: /bookings
            Method: get
            RestApiId: !Ref CloudStoreApi
            Auth:
              Authorizer: CognitoAuthorizer

  CancelBookingHandlerFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .
      Handler: com.cloudstore.handlers.CancelBookingHandler::handleRequest
      Environment:
        Variables:
          BOOKINGS_TABLE_NAME: !Ref BookingsTable
          TABLE_NAME: !Ref StorageUnitsTable
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref BookingsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref StorageUnitsTable
      Events:
        CancelBookingApi:
          Type: Api
          Properties:
            Path: /bookings/{id}
            Method: delete
            RestApiId: !Ref CloudStoreApi
            Auth:
              Authorizer: CognitoAuthorizer

  CloudStoreApi:
    Type: AWS::Serverless::Api
    Properties:
      StageName: Prod
      Auth:
        Authorizers:
          CognitoAuthorizer:
            UserPoolArn: !GetAtt StorageUserPool.Arn

  StorageUserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: CloudStoreUserPool
      UsernameAttributes:
        - email
      AutoVerifiedAttributes:
        - email

  StorageUserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      ClientName: CloudStoreUserPoolClient
      UserPoolId: !Ref StorageUserPool
      ExplicitAuthFlows:
        - ALLOW_USER_PASSWORD_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH
        - ALLOW_USER_SRP_AUTH

  StorageUnitsTable:
    Type: AWS::Serverless::SimpleTable
    Properties:
      PrimaryKey:
        Name: id
        Type: String
      ProvisionedThroughput:
        ReadCapacityUnits: 1
        WriteCapacityUnits: 1

  BookingsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
        - AttributeName: userId
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH
      BillingMode: PAY_PER_REQUEST
      GlobalSecondaryIndexes:
        - IndexName: UserIdIndex
          KeySchema:
            - AttributeName: userId
              KeyType: HASH
          Projection:
            ProjectionType: ALL

Outputs:
  HelloApi:
    Description: "API Gateway endpoint URL for Prod stage for Hello function"
    Value: !Sub "https://${CloudStoreApi}.execute-api.${AWS::Region}.amazonaws.com/Prod/hello/"

  GetUnitsApi:
    Description: "API Gateway endpoint URL for retrieving storage units"
    Value: !Sub "https://${CloudStoreApi}.execute-api.${AWS::Region}.amazonaws.com/Prod/units/"

  CreateBookingApi:
    Description: "API Gateway endpoint URL for creating a booking"
    Value: !Sub "https://${CloudStoreApi}.execute-api.${AWS::Region}.amazonaws.com/Prod/bookings/"

  GetBookingsApi:
    Description: "API Gateway endpoint URL for retrieving bookings"
    Value: !Sub "https://${CloudStoreApi}.execute-api.${AWS::Region}.amazonaws.com/Prod/bookings/"
